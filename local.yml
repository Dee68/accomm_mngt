services:
  api: &api
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    image: accomm_prod_api
    container_name: accomm_prod_api
    volumes:
      - .:/app:z
      - ./staticfiles:/app/staticfiles:z
    # ports:
    #   - "8000:8000" # Uncomment if you need external access
    expose:
      - "8000"
      - "5555:5555"
    env_file:
      - .envs/.env.local
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
    depends_on:
      postgres:
        condition: service_healthy # Waits for healthcheck
      mailpit:
        condition: service_started
      redis:
        condition: service_started

    command: /start
    networks:
      - accomm_prod_nw

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    build:
      context: .
      dockerfile: ./docker/local/postgres/Dockerfile
    image: accomm_prod_postgres
    container_name: accomm_prod_postgres
    ports:
      - "5432:5432"
    volumes:
      - accomm_prod_postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.envs/.env.local
    networks:
      - accomm_prod_nw
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -c 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: docker.io/axllent/mailpit:v1.15
    container_name: accomm_prod_mailpit
    ports:
      - "8025:8025" # web ui
      - "1025:1025" # smtp
    restart: unless-stopped
    volumes:
      - accomm_prod_mailpit_data:/data

    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - accomm_prod_nw

  client:
    build:
      context: ./client
      dockerfile: ./docker/local/Dockerfile
    container_name: accomm_client
    image: accomm_client
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    volumes:
      - ./client:/app
    networks:
      - accomm_prod_nw

  redis:
    image: redis:7.0-alpine3.19
    command: redis-server --appendonly yes
    container_name: accomm_redis
    volumes:
      - accomm_redis_prod_data:/data
    networks:
      - accomm_prod_nw

  celeryworker:
    <<: *api
    image: accomm_prod_celeryworker
    container_name: accomm_prod_celeryworker
    command: /start-celeryworker
    healthcheck:
      disable: true

  celerybeat:
    <<: *api
    image: accomm_prod_celerybeat
    container_name: accomm_prod_celerybeat
    command: /start-celerybeat
    healthcheck:
      disable: true

  flower:
    <<: *api
    image: accomm_prod_flower
    container_name: accomm_prod_flower
    ports:
      - "5555:5555"
    command: /start-flower
    healthcheck:
      disable: true
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://0.0.0.0:5555/"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5

  nginx:
    build:
      context: ./docker/local/nginx
      dockerfile: Dockerfile
    restart: always
    container_name: accomm_nginx
    ports:
      - "8080:80"
    volumes:
      - ./staticfiles:/app/staticfiles:z
      - logs_store:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - accomm_prod_nw

networks:
  accomm_prod_nw:
    external: true # Use manually created network

volumes:
  accomm_prod_postgres_data: {}
  accomm_prod_mailpit_data: {}
  logs_store: {}
  accomm_redis_prod_data: {}
